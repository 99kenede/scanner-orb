<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner ORB - Breakout Prop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e17;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header {
            background: #1a1f2e;
            padding: 15px 20px;
            border-bottom: 2px solid #2a3142;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { color: #00d4ff; font-size: 1.5em; }
        .controls { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .control-group { display: flex; align-items: center; gap: 8px; }
        .control-group label { font-size: 0.9em; color: #8892a0; }
        select {
            background: #2a3142; color: #e0e0e0; border: 1px solid #3a4152;
            padding: 6px 12px; border-radius: 4px; font-size: 0.9em; cursor: pointer;
        }
        select:hover { border-color: #00d4ff; }
        .filter-buttons { display: flex; gap: 8px; }
        .filter-btn {
            background: #2a3142; color: #8892a0; border: 1px solid #3a4152;
            padding: 6px 16px; border-radius: 4px; font-size: 0.9em; cursor: pointer; transition: all 0.3s;
        }
        .filter-btn:hover { border-color: #00d4ff; color: #e0e0e0; }
        .filter-btn.active { background: #00d4ff; color: #0a0e17; border-color: #00d4ff; font-weight: bold; }
        .filter-btn.above.active { background: #00ff88; border-color: #00ff88; }
        .filter-btn.below.active { background: #ff4757; border-color: #ff4757; }
        .status { display: flex; align-items: center; gap: 8px; font-size: 0.9em; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #00ff88; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .table-container { padding: 20px; overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1f2e;
            border-radius: 8px;
            overflow: hidden;
        }
        th {
            background: #252b3d;
            color: #00d4ff;
            padding: 12px;
            text-align: left;
            font-size: 0.9em;
            border-bottom: 2px solid #2a3142;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #2a3142;
            font-size: 0.9em;
        }
        tr:hover { background: #252b3d; }
        .above { color: #00ff88; font-weight: bold; }
        .below { color: #ff4757; font-weight: bold; }
        .inside { color: #8892a0; }
        .session-badge {
            background: #00d4ff;
            color: #0a0e17;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            font-weight: bold;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #8892a0;
            font-size: 1.1em;
        }
        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; }
            .controls { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 Scanner ORB 10min</h1>
        <div class="controls">
            <div class="control-group">
                <label>Sessão:</label>
                <select id="session">
                    <option value="21:00" selected>21:00 BRT (5h)</option>
                    <option value="10:30">10:30 BRT (8h)</option>
                </select>
            </div>
            <div class="control-group">
                <label>Filtro:</label>
                <div class="filter-buttons">
                    <button class="filter-btn above active" data-filter="above">🟢 Altas</button>
                    <button class="filter-btn below" data-filter="below">🔴 Baixas</button>
                    <button class="filter-btn" data-filter="both">🔄 Ambas</button>
                </div>
            </div>
            <div class="status">
                <div class="status-dot"></div>
                <span id="lastUpdate">Conectando...</span>
            </div>
        </div>
    </div>
    
    <div class="table-container">
        <div id="tableContent">
            <div class="empty-state">Aguardando dados...</div>
        </div>
    </div>

    <script>
        let ws;
        let currentData = null;
        let session = '21:00';
        let filter = 'above';

        const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const wsProtocol = isLocal ? 'ws' : 'wss';
        const portSuffix = isLocal ? ':8000' : '';

        function connectWebSocket() {
            ws = new WebSocket(`${wsProtocol}://${window.location.hostname}${portSuffix}/ws`);
            ws.onopen = () => {
                console.log('WebSocket conectado');
                document.getElementById('lastUpdate').textContent = 'Conectado';
                sendConfig();
            };
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                currentData = data;
                document.getElementById('lastUpdate').textContent = `Atualizado: ${data.updated} | Sessão: ${data.session}`;
                renderTable();
            };
            ws.onclose = () => {
                console.log('WebSocket desconectado, reconectando...');
                document.getElementById('lastUpdate').textContent = 'Reconectando...';
                setTimeout(connectWebSocket, 3000);
            };
            ws.onerror = (error) => { console.error('WebSocket erro:', error); };
        }

        function sendConfig() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ session: session, filter: filter }));
            }
        }

        function formatPrice(price) {
            if (price >= 1) return price.toFixed(2);
            if (price >= 0.01) return price.toFixed(4);
            if (price >= 0.0001) return price.toFixed(6);
            return price.toFixed(10);
        }

        function formatVolume(vol) {
            if (vol >= 1_000_000_000) return (vol / 1_000_000_000).toFixed(1) + 'B';
            if (vol >= 1_000_000) return (vol / 1_000_000).toFixed(1) + 'M';
            if (vol >= 1_000) return (vol / 1_000).toFixed(1) + 'K';
            return vol.toFixed(0);
        }

        function renderTable() {
            if (!currentData) return;
            
            const tableContent = document.getElementById('tableContent');
            
            let pairsToShow = [];
            if (filter === 'above') {
                pairsToShow = currentData.above.map(p => ({...p, direction: 'above'}));
            } else if (filter === 'below') {
                pairsToShow = currentData.below.map(p => ({...p, direction: 'below'}));
            } else {
                pairsToShow = [
                    ...currentData.above.map(p => ({...p, direction: 'above'})),
                    ...currentData.below.map(p => ({...p, direction: 'below'}))
                ];
            }
            
            pairsToShow.sort((a, b) => b.distance_pct - a.distance_pct);
            
            if (pairsToShow.length === 0) {
                const msg = filter === 'above' ? '🟢 Nenhuma alta no ORB' : 
                           filter === 'below' ? '🔴 Nenhuma baixa no ORB' : 
                           '⚪ Nenhum par rompeu o ORB ainda';
                tableContent.innerHTML = `<div class="empty-state">${msg}. Aguarde...</div>`;
                return;
            }
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Par</th>
                            <th>Exchange</th>
                            <th>Preço</th>
                            <th>ORB High</th>
                            <th>ORB Low</th>
                            <th>% Distância</th>
                            <th>Volume 24h</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            pairsToShow.forEach((pair, index) => {
                const directionClass = pair.direction;
                const sign = pair.direction === 'above' ? '+' : '-';
                const emoji = pair.direction === 'above' ? '🟢' : '🔴';
                
                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td class="${directionClass}">${emoji} ${pair.symbol} <span class="session-badge">${currentData.session}</span></td>
                        <td>${pair.exchange}</td>
                        <td>${formatPrice(pair.price)}</td>
                        <td>${formatPrice(pair.orb_high)}</td>
                        <td>${formatPrice(pair.orb_low)}</td>
                        <td class="${directionClass}">${sign}${pair.distance_pct.toFixed(2)}%</td>
                        <td>${formatVolume(pair.volume_24h)}</td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            tableContent.innerHTML = html;
        }

        document.getElementById('session').addEventListener('change', (e) => { session = e.target.value; sendConfig(); });
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                filter = e.target.dataset.filter;
                sendConfig();
            });
        });

        connectWebSocket();
    </script>
</body>
</html>
